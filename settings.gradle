pluginManagement {
    repositories {
        maven {
            name = 'wagyourtail releases'
            url = 'https://maven.wagyourtail.xyz/releases'
        }
        maven {
            name = 'wagyourtail snapshots'
            url = 'https://maven.wagyourtail.xyz/snapshots'
        }
        maven {
            name = 'NeoForged'
            url = 'https://maven.neoforged.net/releases'
        }
        maven {
            name = 'MinecraftForge'
            url = 'https://maven.minecraftforge.net/'
        }
        maven {
            name = 'Fabric'
            url = 'https://maven.fabricmc.net/'
        }
        mavenCentral()
        gradlePluginPortal {
            content {
                excludeGroup('org.apache.logging.log4j')
            }
        }
    }
    plugins {
        id 'xyz.wagyourtail.unimined' version "${unimined_version}"
    }
}

plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0'
}

rootProject.name = 'MarumaSign'

include 'core'
include 'bootstrap'
include 'dist'

// targets.json の各項目が、Minecraft のバージョン 1 つ分のビルド対象
// 開発中は -PmarumaOnly=mc1_21_8,mc26_2 のように対象を絞ると、設定にかかる時間を短くできる
def marumaOnly = (providers.gradleProperty('marumaOnly').orNull ?: '').tokenize(',')
new groovy.json.JsonSlurper().parse(file('targets.json')).targets.findAll {
    marumaOnly.isEmpty() || it.name in marumaOnly
}.each { target ->
    include "targets:${target.name}"
    def dir = file("targets/${target.name}")
    dir.mkdirs()
    project(":targets:${target.name}").projectDir = dir
}
