plugins {
    id 'xyz.wagyourtail.unimined' apply false
}

def targetTable = new groovy.json.JsonSlurper().parse(file('targets.json'))
// 各ビルド対象に、世代 (era) ごとの共通設定を合わせたもの
ext.marumaTargets = targetTable.targets.collect { target ->
    def era = targetTable.eras[target.era]
    if (era == null) throw new GradleException("Unknown era '${target.era}' in targets.json")
    era + target
}

allprojects {
    version = rootProject.mod_version
    group = rootProject.maven_group
}

subprojects {
    plugins.withId('java') {
        java {
            toolchain {
                languageVersion = JavaLanguageVersion.of(rootProject.compile_jdk as int)
            }
        }

        tasks.withType(JavaCompile).configureEach {
            options.encoding = 'UTF-8'
            // 古いローダーは jar 内の全クラスを古い ASM で走査するため、
            // すべてのクラスを Java 8 形式 (major 52) で出力する
            options.compilerArgs += ['-Xlint:-options']
        }
    }
}

// targets.json の各項目に共通のビルド設定を適用する
marumaTargets.each { target ->
    project(":targets:${target.name}") {
        ext.spec = target
        apply from: rootProject.file('gradle/target.gradle')
    }
}
