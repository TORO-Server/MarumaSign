import org.objectweb.asm.ClassReader
import org.objectweb.asm.ClassWriter
import org.objectweb.asm.commons.ClassRemapper
import org.objectweb.asm.commons.Remapper

import java.util.zip.ZipFile

buildscript {
    repositories {
        mavenCentral()
    }
    dependencies {
        classpath 'org.ow2.asm:asm-commons:9.8'
    }
}

plugins {
    id 'base'
}

base {
    archivesName = 'MarumaSign'
}

def basePackage = 'marumasa/marumasa_sign'
def targets = rootProject.marumaTargets
def prebuilt = rootProject.marumaPrebuilt
if (prebuilt == null) {
    targets.each { evaluationDependsOn(":targets:${it.name}") }
}
evaluationDependsOn(':core')
evaluationDependsOn(':bootstrap')

// 対象の、ローダーごとに名前を付け替えた jar。marumaPrebuilt を指定したときは、そこに置いてあるものを使う
def remappedJar = { target, String loaderName ->
    if (prebuilt != null) {
        def jar = new File(prebuilt, "${target.name}/${loaderName}.jar")
        if (!jar.isFile()) throw new GradleException("Prebuilt jar is missing: ${jar}")
        return layout.file(providers.provider { jar })
    }
    return project(":targets:${target.name}").tasks.named("remap${loaderName.capitalize()}Jar").flatMap { it.archiveFile }
}

/**
 * jar の中のクラスを、パッケージ名を変えて取り出す。
 * 同じ実装でもローダーごとに実行時の名前 (SRG / 公式 / intermediary) が違うため、
 * 1 つの jar に同居させるにはローダーごとに別のパッケージへ移す必要がある。
 */
abstract class RelocateJar extends DefaultTask {
    @InputFile
    abstract RegularFileProperty getInput()

    @Input
    abstract Property<String> getFromPrefix()

    @Input
    abstract Property<String> getToPrefix()

    @OutputDirectory
    abstract DirectoryProperty getOutput()

    @TaskAction
    void relocate() {
        def outputDir = output.get().asFile
        project.delete(outputDir)
        outputDir.mkdirs()

        def from = fromPrefix.get()
        def to = toPrefix.get()
        def remapper = new Remapper() {
            @Override
            String map(String internalName) {
                if (internalName == from || internalName.startsWith(from + '/')) {
                    return to + internalName.substring(from.length())
                }
                return internalName
            }
        }

        new ZipFile(input.get().asFile).withCloseable { zip ->
            zip.entries().each { entry ->
                if (entry.directory || !entry.name.startsWith(from + '/') || !entry.name.endsWith('.class')) return
                def reader = new ClassReader(zip.getInputStream(entry).bytes)
                def writer = new ClassWriter(0)
                reader.accept(new ClassRemapper(writer, remapper), 0)
                def file = new File(outputDir, to + entry.name.substring(from.length()))
                file.parentFile.mkdirs()
                file.bytes = writer.toByteArray()
            }
        }
    }
}

/**
 * core のクラスと、core が使うライブラリ (PDFBox) を 1 か所にまとめる。
 * ライブラリは、他の Mod や Minecraft 自身が持つ同じライブラリとぶつからないよう、パッケージ名を変える。
 * jar の中のファイル (フォントなど) も同じように移し、それを指す文字列 ("/org/apache/pdfbox/..." など) も書き換える。
 */
abstract class ShadeCore extends DefaultTask {
    @InputFiles
    abstract ConfigurableFileCollection getClasses()

    @InputFiles
    abstract ConfigurableFileCollection getLibraries()

    // 移す前のパッケージ (/ 区切り) -> 移した先
    @Input
    abstract MapProperty<String, String> getPackages()

    @OutputDirectory
    abstract DirectoryProperty getOutput()

    @TaskAction
    void shade() {
        def outputDir = output.get().asFile
        outputDir.deleteDir()
        outputDir.mkdirs()

        def packages = packages.get()
        def mapPath = { String path ->
            for (entry in packages) {
                if (path == entry.key || path.startsWith(entry.key + '/')) return entry.value + path.substring(entry.key.length())
            }
            return path
        }
        def remapper = new Remapper() {
            @Override
            String map(String internalName) {
                return mapPath(internalName)
            }

            @Override
            Object mapValue(Object value) {
                // jar の中のファイルを指す絶対パス
                if (value instanceof String && value.startsWith('/')) return '/' + mapPath(value.substring(1))
                return super.mapValue(value)
            }
        }
        def write = { String path, byte[] bytes ->
            def file = new File(outputDir, path)
            file.parentFile.mkdirs()
            file.bytes = bytes
        }
        def remap = { byte[] bytes ->
            def writer = new ClassWriter(0)
            new ClassReader(bytes).accept(new ClassRemapper(writer, remapper), 0)
            return writer.toByteArray()
        }

        classes.files.each { root ->
            if (!root.isDirectory()) return
            root.eachFileRecurse(groovy.io.FileType.FILES) { file ->
                def path = root.toPath().relativize(file.toPath()).toString().replace('\\', '/')
                write(path.endsWith('.class') ? mapPath(path) : path, path.endsWith('.class') ? remap(file.bytes) : file.bytes)
            }
        }
        libraries.files.each { jar ->
            // ライセンスの全文は、ほかの取り込んだライブラリと同じ場所に、ライブラリの名前を付けて置く
            def library = jar.name.replaceAll(/-[0-9][^-]*\.jar$/, '')
            new ZipFile(jar).withCloseable { zip ->
                zip.entries().each { entry ->
                    if (entry.directory) return
                    def bytes = zip.getInputStream(entry).bytes
                    if (entry.name.startsWith('META-INF/')) {
                        if (entry.name == 'META-INF/LICENSE') write("marumasa_sign/licenses/${library}.txt", bytes)
                        if (entry.name == 'META-INF/NOTICE') write("marumasa_sign/licenses/${library}-notice.txt", bytes)
                        return
                    }
                    write(mapPath(entry.name), entry.name.endsWith('.class') ? remap(bytes) : bytes)
                }
            }
        }
    }
}

def shadeCore = tasks.register('shadeCore', ShadeCore) {
    classes.from(project(':core').sourceSets.main.output.classesDirs)
    libraries.from(project(':core').configurations.bundled)
    packages.put('org/apache/pdfbox', "${basePackage}/lib/pdfbox")
    packages.put('org/apache/fontbox', "${basePackage}/lib/fontbox")
    packages.put('org/apache/commons/logging', "${basePackage}/lib/logging")
    output = layout.buildDirectory.dir('shaded/core')
}

// ---------- 統合 jar (Forge / NeoForge / Fabric) ----------

// 「ローダー.バージョン = 実装の名前」の対応表
def tableLines = []
def relocateTasks = []

targets.each { target ->
    ['forge', 'neoforge'].each { loaderName ->
        def loaderSpec = target.loaders[loaderName]
        if (loaderSpec == null) return
        loaderSpec.versions.each { tableLines << "${loaderName}.${it}=${target.name}" }

        def remapped = remappedJar(target, loaderName)
        relocateTasks << tasks.register("relocate${loaderName.capitalize()}${target.name.capitalize()}", RelocateJar) {
            input = remapped
            fromPrefix = "${basePackage}/adapter"
            toPrefix = "${basePackage}/${loaderName}/${target.name}"
            output = layout.buildDirectory.dir("relocated/${loaderName}/${target.name}")
        }
    }
}

// Fabric は jar の中の jar を扱えるので、バージョンごとの実装をそのまま同梱し、
// 実行中のバージョンに合うものだけを Fabric Loader に選ばせる
def fabricJars = [:]
targets.each { target ->
    if (target.loaders.fabric == null) return
    fabricJars["marumasa_sign-fabric-${target.name}.jar".toString()] = remappedJar(target, 'fabric')
}

def generateFabricMetadata = tasks.register('generateFabricMetadata') {
    def outputDir = layout.buildDirectory.dir('generated/fabric')
    def json = groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson([
            schemaVersion: 1,
            id           : 'marumasa_sign',
            version      : project.version.toString(),
            name         : 'MarumaSign',
            description  : 'Display images on signs.',
            authors      : ['marumasa'],
            contact      : [repo: 'https://github.com/TORO-Server/MarumaSign'],
            license      : 'MIT',
            icon         : 'assets/marumasa_sign/icon.png',
            environment  : 'client',
            jars         : fabricJars.keySet().sort().collect { [file: "META-INF/jars/${it}".toString()] },
    ]))
    inputs.property('json', json)
    outputs.dir(outputDir)
    doLast {
        def file = new File(outputDir.get().asFile, 'fabric.mod.json')
        file.parentFile.mkdirs()
        file.setText(json + '\n', 'UTF-8')
    }
}

def generateTable = tasks.register('generateTable') {
    def lines = tableLines.sort()
    def outputDir = layout.buildDirectory.dir('generated/table')
    inputs.property('lines', lines)
    outputs.dir(outputDir)
    doLast {
        def file = new File(outputDir.get().asFile, 'marumasa_sign/targets.properties')
        file.parentFile.mkdirs()
        file.setText(lines.join('\n') + '\n', 'UTF-8')
    }
}

def resourceProperties = [version: project.version.toString()]

def universalJar = tasks.register('universalJar', Jar) {
    archiveVersion = project.version.toString()
    destinationDirectory = layout.buildDirectory.dir('libs')
    duplicatesStrategy = DuplicatesStrategy.FAIL

    from(shadeCore)
    from(project(':core').tasks.named('processResources'))
    from(project(':bootstrap').sourceSets.main.output)
    relocateTasks.each { from(it) }
    from(generateTable)
    from(generateFabricMetadata)
    fabricJars.each { name, jar ->
        from(jar) {
            into 'META-INF/jars'
            rename { name }
        }
    }

    from('src/main/resources') {
        inputs.properties(resourceProperties)
        filesMatching(['mcmod.info', 'META-INF/mods.toml', 'META-INF/neoforge.mods.toml']) {
            expand(resourceProperties)
        }
    }
    // Minecraft 1.10.2 以前は言語ファイルの名前に大文字を使う
    from('src/main/resources/assets/marumasa_sign/lang') {
        include '*.lang'
        // 地域のない言語コード (bar など) は古いバージョンにはないので、大文字にしたものは入れない
        exclude { !it.name.contains('_') }
        into 'assets/marumasa_sign/lang'
        rename { String name ->
            def parts = name.replace('.lang', '').split('_')
            "${parts[0]}_${parts[1].toUpperCase()}.lang"
        }
    }
    from(rootProject.file('LICENSE')) {
        rename { "${it}_marumasa_sign" }
    }
}

// ---------- LiteLoader 用 (.litemod はバージョンごとに 1 つ) ----------

def litemodTasks = []
targets.each { target ->
    def loaderSpec = target.loaders.liteloader
    if (loaderSpec == null) return
    def remapped = remappedJar(target, 'liteloader')

    def metadata = tasks.register("litemodJson${target.name.capitalize()}") {
        def outputDir = layout.buildDirectory.dir("generated/litemod/${target.name}")
        def json = groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson([
                name       : 'MarumaSign',
                mcversion  : target.minecraft,
                version    : project.version.toString(),
                revision   : '1',
                author     : 'marumasa',
                description: 'Display images on signs.',
                url        : 'https://github.com/TORO-Server/MarumaSign'
        ]))
        inputs.property('json', json)
        outputs.dir(outputDir)
        doLast {
            def file = new File(outputDir.get().asFile, 'litemod.json')
            file.parentFile.mkdirs()
            file.setText(json + '\n', 'UTF-8')
        }
    }

    litemodTasks << tasks.register("litemod${target.name.capitalize()}", Jar) {
        archiveVersion = project.version.toString()
        archiveClassifier = "liteloader-mc${target.minecraft}"
        archiveExtension = 'litemod'
        destinationDirectory = layout.buildDirectory.dir('libs')
        duplicatesStrategy = DuplicatesStrategy.FAIL

        from(shadeCore)
        from(project(':core').tasks.named('processResources'))
        from(remapped.map { zipTree(it) }) {
            include "${basePackage}/**"
        }
        from(metadata)
        from('src/main/resources') {
            include 'assets/**'
            include 'pack.mcmeta'
        }
        from('src/main/resources/assets/marumasa_sign/lang') {
            include '*.lang'
            exclude { !it.name.contains('_') }
            into 'assets/marumasa_sign/lang'
            rename { String name ->
                def parts = name.replace('.lang', '').split('_')
                "${parts[0]}_${parts[1].toUpperCase()}.lang"
            }
        }
        from(rootProject.file('LICENSE')) {
            rename { "${it}_marumasa_sign" }
        }
    }
}

assemble.dependsOn(universalJar)
litemodTasks.each { assemble.dependsOn(it) }
