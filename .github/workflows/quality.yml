name: Quality

# 不具合を探す検査。CI (PR) から呼ばれるほか、毎晩ファジングを長くして動かす。
# - no-libraries: ライブラリ (第三者のコード) を使っていないこと、配布物に入っていないこと
# - core-checks: core をコンパイルし (警告も検査)、試験とファジングを動かす (Java 25 と、古い Minecraft が使う Java 8 の両方)
# - codeql: GitHub の CodeQL による静的解析 (セキュリティの問題を含む)
on:
  workflow_call:
    inputs:
      mode:
        description: quick (PR) か long (毎晩)
        type: string
        default: quick
  schedule:
    # 毎晩 (日本時間の 3 時 17 分)
    - cron: '17 18 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: quick か long
        type: choice
        options: [quick, long]
        default: long

permissions:
  contents: read

jobs:
  no-libraries:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Check that no third-party library is used
        run: python3 .github/scripts/check-no-libraries.py

      - name: Check that the Python tools compile
        run: python3 -m compileall -q tools .github/scripts

  core-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        java: ['25', '8']
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      # Java 8 の javac は --release を知らないので、コンパイルはいつも Java 25 で行い、試験だけを各版の java で動かす
      - name: Set up JDK ${{ matrix.java }}
        if: matrix.java != '25'
        uses: actions/setup-java@v5
        with:
          java-version: ${{ matrix.java }}
          distribution: 'temurin'

      - name: Remember the test runtime
        if: matrix.java != '25'
        run: echo "TEST_JAVA_HOME=$JAVA_HOME" >> "$GITHUB_ENV"

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Run core checks
        env:
          MODE: ${{ inputs.mode || (github.event_name == 'schedule' && 'long') || 'quick' }}
        run: |
          if [ -n "${TEST_JAVA_HOME:-}" ]; then
            # javac は Java 25、java は試験する版にする
            mkdir -p "$RUNNER_TEMP/bin"
            ln -sf "$JAVA_HOME/bin/javac" "$RUNNER_TEMP/bin/javac"
            ln -sf "$TEST_JAVA_HOME/bin/java" "$RUNNER_TEMP/bin/java"
            export PATH="$RUNNER_TEMP/bin:$PATH"
          fi
          java -version
          bash .github/scripts/run-core-checks.sh "$MODE"

      - name: Upload failing fuzz inputs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: fuzz-failures-java${{ matrix.java }}
          path: |
            core/build/pdf-fuzz
            core/build/fuzz*
          if-no-files-found: ignore
          retention-days: 14

  codeql:
    runs-on: ubuntu-latest
    # ビルドせずに解析しても、リポジトリが大きいので 1 時間を超えることがある
    timeout-minutes: 120
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      # Minecraft の準備に時間がかかるので、ビルドせずに解析する (build-mode: none)
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: java-kotlin
          build-mode: none
          # セキュリティの問題を探す問い合わせに絞る (品質の問い合わせまで入れると、時間内に終わらない)
          queries: security-extended

      - name: Analyze
        uses: github/codeql-action/analyze@v4
        with:
          category: /language:java-kotlin
