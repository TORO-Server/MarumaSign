name: Build

# CI と Release から呼ぶ、配布するファイルのビルド。
# 対象ごとの Minecraft の準備 (Forge / NeoForge のインストールなど) に時間がかかるので、
# 対象をいくつかの組に分けて別々のジョブで並べてビルドし、最後に 1 つのジョブで jar にまとめる。
# まとめるジョブは、各組が作った対象ごとの jar を使うので、Minecraft の準備をしない。
on:
  workflow_call:
    inputs:
      groups:
        description: 対象を分ける組の数
        type: number
        default: 8

permissions:
  contents: read

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Split targets into groups
        id: plan
        run: |
          matrix="$(python3 tools/ci_groups.py ${{ inputs.groups }})"
          echo "$matrix"
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  targets:
    name: targets ${{ matrix.index }}
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: true
      matrix: ${{ fromJson(needs.plan.outputs.matrix) }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Make gradle wrapper executable
        run: chmod +x gradlew

      # 目安は ${{ matrix.estimate }} 分 (tools/ci_groups.py の重み)
      - name: Build targets
        run: ./gradlew -PmarumaOnly=${{ matrix.targets }} exportRemapped

      - name: Upload target jars
        uses: actions/upload-artifact@v7
        with:
          name: prebuilt-${{ matrix.index }}
          path: build/prebuilt
          if-no-files-found: error
          retention-days: 1

  assemble:
    needs: targets
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Make gradle wrapper executable
        run: chmod +x gradlew

      - name: Download target jars
        uses: actions/download-artifact@v8
        with:
          pattern: prebuilt-*
          path: prebuilt
          merge-multiple: true

      # すべての対象の jar がそろっていることを確かめる (組の分け方の間違いで抜けないように)
      - name: Check that every target was built
        run: |
          python3 - <<'EOF'
          import json, os, sys
          targets = json.load(open("targets.json", encoding="utf-8"))["targets"]
          missing = [f"{t['name']}/{loader}.jar" for t in targets for loader in t["loaders"]
                     if not os.path.isfile(os.path.join("prebuilt", t["name"], f"{loader}.jar"))]
          if missing:
              print("::error::Missing target jars: " + ", ".join(missing))
              sys.exit(1)
          print(f"{len(targets)} targets ok")
          EOF

      - name: Assemble
        run: ./gradlew -PmarumaPrebuilt="$GITHUB_WORKSPACE/prebuilt" :dist:assemble

      # FFmpeg は jar に入れない (利用者が自分で用意する)
      - name: Check that FFmpeg is not bundled
        run: bash .github/scripts/check-no-ffmpeg.sh dist/build/libs

      # ライブラリ (第三者のクラス) を jar に入れない
      - name: Check that only MarumaSign's own files are bundled
        run: bash .github/scripts/check-jar-contents.sh dist/build/libs

      - name: Upload build output
        uses: actions/upload-artifact@v7
        with:
          name: MarumaSign
          path: |
            dist/build/libs/*.jar
            dist/build/libs/*.litemod
          if-no-files-found: error
