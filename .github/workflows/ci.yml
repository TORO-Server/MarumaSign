name: CI

# 同じ変更で二重に動かさない。
# PR のあるブランチは pull_request だけで動かし、push で動かすのは PR を作る前の確認用に限る。
# ドキュメントだけの変更では動かさない。
on:
  pull_request:
    paths-ignore:
      - 'docs/**'
      - '**.md'
      - 'LICENSE'
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  security-events: write

jobs:
  # 対象を組に分けて並べてビルドする (build.yml)
  build:
    uses: ./.github/workflows/build.yml

  # 不具合を探す検査 (ライブラリを使っていないこと、試験、ファジング、静的解析)。quality.yml
  quality:
    uses: ./.github/workflows/quality.yml
    with:
      mode: quick
