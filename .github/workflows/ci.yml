name: CI

# 同じ変更で二重に動かさない。
# PR のあるブランチは pull_request だけで動かし、push で動かすのは PR を作る前の確認用に限る。
# ドキュメントだけの変更では動かさない。
on:
  pull_request:
    paths-ignore:
      - 'docs/**'
      - '**.md'
      - 'LICENSE'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 対象を組に分けて並べてビルドする (build.yml)
  build:
    uses: ./.github/workflows/build.yml
