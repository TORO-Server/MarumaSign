name: CI

on:
  pull_request:
  push:
    branches-ignore:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradle wrapper executable
        run: chmod +x gradlew

      # 対応するすべてのバージョンの Minecraft を取得するため、時間がかかる
      - name: Build with Gradle
        run: ./gradlew :dist:assemble

      # FFmpeg は jar に入れない (利用者が自分で用意する)
      - name: Check that FFmpeg is not bundled
        run: bash .github/scripts/check-no-ffmpeg.sh dist/build/libs

      - name: Upload build output
        uses: actions/upload-artifact@v4
        with:
          name: MarumaSign
          path: |
            dist/build/libs/*.jar
            dist/build/libs/*.litemod
          if-no-files-found: error
