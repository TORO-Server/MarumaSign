name: CI

# 1 回のビルドに 1〜2 時間かかるので、同じ変更で二重に動かさない。
# PR のあるブランチは pull_request だけで動かし、push で動かすのは PR を作る前の確認用に限る。
# ドキュメントだけの変更では動かさない。
on:
  pull_request:
    paths-ignore:
      - 'docs/**'
      - '**.md'
      - 'LICENSE'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Make gradle wrapper executable
        run: chmod +x gradlew

      # 対応するすべてのバージョンの Minecraft を取得するため、時間がかかる
      - name: Build with Gradle
        run: ./gradlew :dist:assemble

      # FFmpeg は jar に入れない (利用者が自分で用意する)
      - name: Check that FFmpeg is not bundled
        run: bash .github/scripts/check-no-ffmpeg.sh dist/build/libs

      - name: Upload build output
        uses: actions/upload-artifact@v6
        with:
          name: MarumaSign
          path: |
            dist/build/libs/*.jar
            dist/build/libs/*.litemod
          if-no-files-found: error
