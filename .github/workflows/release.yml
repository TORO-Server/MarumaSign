name: Release Mod

# main に入った時点で、gradle.properties の mod_version と同じ名前のタグ (v4.0.0 など) がまだなければ、
# ビルドして GitHub Release を作る。バージョンを上げずに main へ入れた場合は何もしない。
on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      release: ${{ steps.version.outputs.release }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Read version from gradle.properties
        id: version
        shell: bash
        run: |
          VERSION=$(grep -E '^mod_version' gradle.properties | cut -d'=' -f2 | tr -d '[:space:]')
          if [ -z "$VERSION" ]; then
            echo "::error::gradle.properties に mod_version がありません"
            exit 1
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          if git ls-remote --exit-code --tags origin "refs/tags/v${VERSION}" >/dev/null 2>&1; then
            echo "Tag v${VERSION} already exists. Skipping release."
            echo "release=false" >> "$GITHUB_OUTPUT"
          else
            echo "release=true" >> "$GITHUB_OUTPUT"
          fi

  # 対象を組に分けて並べてビルドする (build.yml)
  build:
    needs: version
    if: needs.version.outputs.release == 'true'
    permissions:
      contents: read
    uses: ./.github/workflows/build.yml

  release:
    needs: [version, build]
    if: needs.version.outputs.release == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Download build output
        uses: actions/download-artifact@v8
        with:
          name: MarumaSign
          path: dist/build/libs

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: MarumaSign ${{ needs.version.outputs.version }}
          generate_release_notes: true
          files: |
            dist/build/libs/*.jar
            dist/build/libs/*.litemod
          fail_on_unmatched_files: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
