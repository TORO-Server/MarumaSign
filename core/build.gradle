plugins {
    id 'java-library'
}

repositories {
    mavenCentral()
}

configurations {
    // 配布する jar に、パッケージ名を変えて同梱するライブラリ (dist の shadeCore で取り込む)
    bundled {
        transitive = false
    }
}

dependencies {
    // 1.7.10 に同梱されている版。これより新しい API は使わない
    compileOnly 'org.apache.logging.log4j:log4j-api:2.0-beta9'
    testImplementation 'org.apache.logging.log4j:log4j-api:2.0-beta9'

    // PDF の読み込みと描画。Java 6 以降で動く 2.0 系を使う。
    // ログの出力先 (Commons Logging) は同梱せず、marumasa.marumasa_sign.lib.logging の代わりのクラスに付け替える
    bundled 'org.apache.pdfbox:pdfbox:2.0.37'
    bundled 'org.apache.pdfbox:fontbox:2.0.37'
    compileOnly 'org.apache.pdfbox:pdfbox:2.0.37'
    testImplementation 'org.apache.pdfbox:pdfbox:2.0.37'
}

// Minecraft を起動せずに画面の見た目を PNG に書き出す
tasks.register('uiPreview', JavaExec) {
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'marumasa.marumasa_sign.core.UiPreview'
    javaLauncher = javaToolchains.launcherFor(java.toolchain)
    args = [layout.buildDirectory.dir('ui-preview').get().asFile.path,
            providers.gradleProperty('previewLang').getOrElse('ja_jp'),
            providers.gradleProperty('previewScale').getOrElse('2')] +
            (providers.gradleProperty('previewImage').isPresent() ? [providers.gradleProperty('previewImage').get()] : [])
}

// Minecraft を起動せずに 3D モデルを PNG に描く。引数は -PgltfArgs="出力先 時刻 モデルのファイル..." で渡す
tasks.register('gltfCheck', JavaExec) {
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'marumasa.marumasa_sign.core.gltf.GltfCheck'
    javaLauncher = javaToolchains.launcherFor(java.toolchain)
    args = providers.gradleProperty('gltfArgs').getOrElse('').tokenize(' ')
}

// Draco デコーダの単体テスト・安全性検査を実行する
tasks.register('dracoCheck', JavaExec) {
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'marumasa.marumasa_sign.core.gltf.DracoCheck'
    javaLauncher = javaToolchains.launcherFor(java.toolchain)
}

// テクスチャデコーダの動作を確認する。引数は -PtextureArgs="出力先 ファイル..." で渡す
tasks.register('textureCheck', JavaExec) {
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'marumasa.marumasa_sign.core.texture.TextureCheck'
    javaLauncher = javaToolchains.launcherFor(java.toolchain)
    args = providers.gradleProperty('textureArgs').getOrElse('').tokenize(' ')
}

// PDF の看板の表示とページ送りを、Minecraft を起動せずに確かめる。引数は -PpdfArgs="PDF のファイル 出力先" で渡す
tasks.register('pdfCheck', JavaExec) {
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'marumasa.marumasa_sign.core.SignPdfCheck'
    javaLauncher = javaToolchains.launcherFor(java.toolchain)
    args = providers.gradleProperty('pdfArgs').getOrElse('').tokenize(' ')
}

tasks.withType(JavaCompile).configureEach {
    // Minecraft に依存しないので JDK 8 の API だけに制限する
    options.release = 8
}
