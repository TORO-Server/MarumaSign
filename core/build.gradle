plugins {
    id 'java-library'
}

repositories {
    mavenCentral()
}

configurations {
    // 配布する jar に、パッケージ名を変えて同梱するライブラリ (dist の shadeCore で取り込む)
    bundled {
        transitive = false
    }
}

dependencies {
    // 1.7.10 に同梱されている版。これより新しい API は使わない
    compileOnly 'org.apache.logging.log4j:log4j-api:2.0-beta9'
    testImplementation 'org.apache.logging.log4j:log4j-api:2.0-beta9'

    // PDF の読み込みと描画。Java 6 以降で動く 2.0 系を使う。
    // ログの出力先 (Commons Logging) は同梱せず、marumasa.marumasa_sign.lib.logging の代わりのクラスに付け替える
    bundled 'org.apache.pdfbox:pdfbox:2.0.37'
    bundled 'org.apache.pdfbox:fontbox:2.0.37'
    compileOnly 'org.apache.pdfbox:pdfbox:2.0.37'
    testImplementation 'org.apache.pdfbox:pdfbox:2.0.37'
}

// Minecraft を起動せずに画面の見た目を PNG に書き出す
tasks.register('uiPreview', JavaExec) {
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'marumasa.marumasa_sign.core.UiPreview'
    javaLauncher = javaToolchains.launcherFor(java.toolchain)
    args = [layout.buildDirectory.dir('ui-preview').get().asFile.path,
            providers.gradleProperty('previewLang').getOrElse('ja_jp'),
            providers.gradleProperty('previewScale').getOrElse('2')] +
            (providers.gradleProperty('previewImage').isPresent() ? [providers.gradleProperty('previewImage').get()] : [])
}

// Minecraft を起動せずに 3D モデルを PNG に描く。引数は -PgltfArgs="出力先 時刻 モデルのファイル..." で渡す
tasks.register('gltfCheck', JavaExec) {
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'marumasa.marumasa_sign.core.gltf.GltfCheck'
    javaLauncher = javaToolchains.launcherFor(java.toolchain)
    args = providers.gradleProperty('gltfArgs').getOrElse('').tokenize(' ')
}

// 3D モデルを読み込んだ結果のハッシュを表示する (読み込みを速くしても結果が変わらないことを確かめる)。引数は -PgltfHashArgs="モデルのファイル..."
tasks.register('gltfHash', JavaExec) {
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'marumasa.marumasa_sign.core.gltf.GltfHash'
    javaLauncher = javaToolchains.launcherFor(java.toolchain)
    maxHeapSize = '4g'
    args = providers.gradleProperty('gltfHashArgs').getOrElse('').tokenize(' ')
}

// Draco デコーダの単体テスト・安全性検査を実行する
tasks.register('dracoCheck', JavaExec) {
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'marumasa.marumasa_sign.core.gltf.DracoCheck'
    javaLauncher = javaToolchains.launcherFor(java.toolchain)
}

// テクスチャデコーダの動作を確認する。引数は -PtextureArgs="出力先 ファイル..." で渡す
tasks.register('textureCheck', JavaExec) {
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'marumasa.marumasa_sign.core.texture.TextureCheck'
    javaLauncher = javaToolchains.launcherFor(java.toolchain)
    args = providers.gradleProperty('textureArgs').getOrElse('').tokenize(' ')
}

// meshopt の展開を、テスト用の符号化との往復と、壊したデータで確かめる。引数は -PmeshoptCheckArgs="壊したデータを試す秒数"
tasks.register('meshoptCheck', JavaExec) {
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'marumasa.marumasa_sign.core.gltf.meshopt.MeshoptCheck'
    javaLauncher = javaToolchains.launcherFor(java.toolchain)
    args = providers.gradleProperty('meshoptCheckArgs').getOrElse('').tokenize(' ')
}

// BC6H / BC7 / UASTC / ETC1S の展開を、乱数のブロックと小さな KTX2 のハッシュ、壊したデータで確かめる。
// 引数は -PcompressedTextureArgs="壊したデータを試す秒数"
tasks.register('compressedTextureCheck', JavaExec) {
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'marumasa.marumasa_sign.core.texture.CompressedTextureCheck'
    javaLauncher = javaToolchains.launcherFor(java.toolchain)
    args = providers.gradleProperty('compressedTextureArgs').getOrElse('').tokenize(' ')
}

// ガウシアンスプラッティングを PNG に描く。引数は -PsplatPreviewArgs="出力先 スプラットのファイル..." で渡す
tasks.register('splatPreview', JavaExec) {
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'marumasa.marumasa_sign.core.splat.SplatPreview'
    javaLauncher = javaToolchains.launcherFor(java.toolchain)
    args = providers.gradleProperty('splatPreviewArgs').getOrElse('').tokenize(' ')
}

// ガウシアンスプラッティングの並べ替えと頂点生成の時間を測る。引数は -PsplatBenchArgs="ファイル" で渡す
tasks.register('splatBenchmark', JavaExec) {
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'marumasa.marumasa_sign.core.splat.SplatBenchmark'
    javaLauncher = javaToolchains.launcherFor(java.toolchain)
    args = providers.gradleProperty('splatBenchArgs').getOrElse('').tokenize(' ')
}

// 画像のピクセルを直接読む処理 (ArgbPixels) が、BufferedImage.getRGB と同じ結果になるかを確かめる。引数は -PimageArgs="画像のファイル..."
tasks.register('argbCheck', JavaExec) {
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'marumasa.marumasa_sign.core.image.ArgbPixelsCheck'
    javaLauncher = javaToolchains.launcherFor(java.toolchain)
    args = providers.gradleProperty('imageArgs').getOrElse('').tokenize(' ')
}

// 画像の各形式のデコーダを、別のツールで作ったファイルで確かめる。引数は -PformatArgs="出力先 元の画像 ファイルまたはフォルダ..."
tasks.register('formatCheck', JavaExec) {
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'marumasa.marumasa_sign.core.image.ImageFormatsCheck'
    javaLauncher = javaToolchains.launcherFor(java.toolchain)
    maxHeapSize = '2g'
    args = providers.gradleProperty('formatArgs').getOrElse('').tokenize(' ')
}

// 壊した画像のファイルを読ませて、想定外の例外や長い時間にならないかを確かめる。引数は -PimageFuzzArgs="回数 ファイルまたはフォルダ..."
tasks.register('formatFuzz', JavaExec) {
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'marumasa.marumasa_sign.core.image.ImageFormatsFuzz'
    javaLauncher = javaToolchains.launcherFor(java.toolchain)
    maxHeapSize = '1g'
    args = providers.gradleProperty('imageFuzzArgs').getOrElse('').tokenize(' ')
}

// PDF の代わりのフォントを探す一覧 (SystemFonts) が、PDFBox の標準の一覧と同じになるかを確かめる (フォントが多いと 1 分ほどかかる)
tasks.register('fontListCheck', JavaExec) {
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'marumasa.marumasa_sign.core.pdf.FontListCheck'
    javaLauncher = javaToolchains.launcherFor(java.toolchain)
    maxHeapSize = '2g'
}

// ダウンロードしたファイルを残しておく仕組み (DownloadCache) を、手元の HTTP サーバーで確かめる
tasks.register('downloadCacheCheck', JavaExec) {
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'marumasa.marumasa_sign.core.net.DownloadCacheCheck'
    javaLauncher = javaToolchains.launcherFor(java.toolchain)
}

// 看板の URL で、見た人のパソコンの中や家の中のネットワークにアクセスさせられないことを確かめる
tasks.register('securityCheck', JavaExec) {
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'marumasa.marumasa_sign.core.net.SecurityCheck'
    javaLauncher = javaToolchains.launcherFor(java.toolchain)
}

// 違う URL の看板や動画をたくさん並べられても、メモリと再生の数が上限を超えないことを確かめる
tasks.register('signLimitsCheck', JavaExec) {
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'marumasa.marumasa_sign.core.SignLimitsCheck'
    javaLauncher = javaToolchains.launcherFor(java.toolchain)
    maxHeapSize = '3g'
}

// 看板に表示するファイルの、ダウンロードと読み込みの時間を測る。引数は -PloadBenchArgs="回数 ファイル..." で渡す
tasks.register('loadBenchmark', JavaExec) {
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'marumasa.marumasa_sign.core.LoadBenchmark'
    javaLauncher = javaToolchains.launcherFor(java.toolchain)
    maxHeapSize = '4g'
    args = providers.gradleProperty('loadBenchArgs').getOrElse('').tokenize(' ')
}

// 構造物のファイルを読み込んで PNG に描く。引数は -PstructureArgs="出力先 ファイルまたはフォルダ..." で渡す。
// ブロックのテクスチャに使う Minecraft の jar は -PassetJar=jar の場所 で指定できる (指定しなければダウンロードする)
tasks.register('structureCheck', JavaExec) {
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'marumasa.marumasa_sign.core.structure.StructureCheck'
    javaLauncher = javaToolchains.launcherFor(java.toolchain)
    maxHeapSize = '4g'
    args = providers.gradleProperty('structureArgs').getOrElse('').tokenize(' ')
    if (providers.gradleProperty('assetJar').isPresent()) systemProperty 'marumasign.assetJar', providers.gradleProperty('assetJar').get()
    systemProperty 'marumasign.gameDir', layout.buildDirectory.dir('structure-game').get().asFile.path
}

// 壊した構造物のファイルを読ませて、想定外の例外や長い時間にならないかを確かめる。
// 引数は -PfuzzArgs="回数 ファイルまたはフォルダ..." で渡す。-PfuzzMesh を付けると、3D モデルにするところまで確かめる
tasks.register('structureFuzz', JavaExec) {
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'marumasa.marumasa_sign.core.structure.StructureFuzz'
    javaLauncher = javaToolchains.launcherFor(java.toolchain)
    maxHeapSize = '4g'
    args = providers.gradleProperty('fuzzArgs').getOrElse('').tokenize(' ')
    if (providers.gradleProperty('fuzzMesh').isPresent()) systemProperty 'fuzz.mesh', 'true'
    if (providers.gradleProperty('assetJar').isPresent()) systemProperty 'marumasign.assetJar', providers.gradleProperty('assetJar').get()
    systemProperty 'marumasign.gameDir', layout.buildDirectory.dir('structure-game').get().asFile.path
}

// 構造物の中にある MarumaSign の看板を、悪用を含めて確かめる。-PassetJar は structureCheck と同じ
tasks.register('nestedSignCheck', JavaExec) {
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'marumasa.marumasa_sign.core.structure.NestedSignCheck'
    javaLauncher = javaToolchains.launcherFor(java.toolchain)
    maxHeapSize = '4g'
    if (providers.gradleProperty('assetJar').isPresent()) systemProperty 'marumasign.assetJar', providers.gradleProperty('assetJar').get()
    systemProperty 'marumasign.gameDir', layout.buildDirectory.dir('structure-game').get().asFile.path
}

// ガウシアンスプラッティングのデコーダの動作と安全性を確認する。
// -PsplatArgs="テスト用データのフォルダ" を渡すと、実データでの検査と、ほかの実装との数値の比較も行う
tasks.register('splatCheck', JavaExec) {
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'marumasa.marumasa_sign.core.splat.SplatCheck'
    javaLauncher = javaToolchains.launcherFor(java.toolchain)
    maxHeapSize = '2g'
    args = providers.gradleProperty('splatArgs').getOrElse('').tokenize(' ')
}

// 動画や音声の看板が読み込まれて表示されるまでを、Minecraft を起動せずに確かめる。
// 引数は -PmediaArgs="URL 秒数 最後の絵の出力先" で渡す (手元のサーバーの URL も読めるようにしてある)
tasks.register('mediaCheck', JavaExec) {
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'marumasa.marumasa_sign.core.SignMediaCheck'
    javaLauncher = javaToolchains.launcherFor(java.toolchain)
    args = providers.gradleProperty('mediaArgs').getOrElse('').tokenize(' ')
    systemProperty 'marumasign.allowLocalUrls', 'true'
}

// PDF の看板の表示とページ送りを、Minecraft を起動せずに確かめる。引数は -PpdfArgs="PDF のファイル 出力先" で渡す
tasks.register('pdfCheck', JavaExec) {
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'marumasa.marumasa_sign.core.SignPdfCheck'
    javaLauncher = javaToolchains.launcherFor(java.toolchain)
    args = providers.gradleProperty('pdfArgs').getOrElse('').tokenize(' ')
}

tasks.withType(JavaCompile).configureEach {
    // Minecraft に依存しないので JDK 8 の API だけに制限する
    options.release = 8
}
